# Deploy coach-api (Cloudflare Worker) on every push to main
# Secrets required in GitHub repo Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   — Workers Edit + Account Read
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
#   GROQ_API_KEY           — free key from https://console.groq.com
# Optional:
#   COACH_WORKER_NAME      — defaults to astronavigator-coach

name: Deploy Coach API

on:
  push:
    branches: [main]
    paths:
      - 'coach-api/**'
      - '.github/workflows/deploy-coach.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coach-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coach-api/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync GROQ_API_KEY secret to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret is empty — skip secret sync"
            exit 0
          fi
          # stdin only — never print the key
          printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
