# Build SPA and publish to GitHub Pages (branch gh-pages)
# Secrets (optional but recommended):
#   VITE_COACH_API_URL          — e.g. https://astronavigator-coach.<subdomain>.workers.dev
#   VITE_TELEGRAM_BOT_USERNAME  — pay bot username without @ (enables auto Stars checkout)
#   VITE_PAY_API_URL            — pay bot Worker URL for signed unlock claim
# Without coach URL the app still works with the local rule-based helper.
# Without bot username pay buttons fall back to manual support chat.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'coach-api/**'
      - 'telegram-bot/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_COACH_API_URL: ${{ secrets.VITE_COACH_API_URL }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_PAY_API_URL: ${{ secrets.VITE_PAY_API_URL }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
